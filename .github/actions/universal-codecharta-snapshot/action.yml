name: CodeCharta snapshot
description: >
  Runs CodeCharta source, LOC, git and dependency analysis against the checked-out
  repository. Produces a `${project_name}.cc.json.gz` map with a native dependency
  lens by default. The optional legacy pipeline also emits `.cg.json`. Supports
  HEAD snapshots and lightweight snapshots over recent merge commits.

inputs:
  mode:
    required: true
    description: >
      `snapshot` to analyze HEAD (produces a map and optional legacy graph); `history` to walk N
      recent first-parent merges and produce one map per merge into
      `build/codecharta/pull-requests/` (no `.cg.json` per snapshot).
  project_name:
    required: true
    description: >
      Used as the output file prefix. Conventionally equal to the consumer
      repo's name; appears as the folder name in the data repo's
      `projects/<project_name>/` tree.
  stack:
    required: false
    default: multi
    description: >
      Stack profile that determines the default ccsh file-extension filter and
      tokei language filter. One of: swift, kotlin, kmp, ft-fullstack, multi.
      `multi` omits both filters and lets the analyzers consider every
      recognized file.
  file_extensions:
    required: false
    description: >
      Optional override for the `-fe=` flag passed to ccsh unifiedparser.
      Comma-separated list of file extensions, e.g. `kt,swift`. When unset,
      defaults derived from `stack` apply.
  tokei_types:
    required: false
    description: >
      Optional override for the `--type` flag passed to tokei. Comma-separated
      list of tokei language names, e.g. `Kotlin,Swift`. When unset, defaults
      derived from `stack` apply.
  extra_excludes:
    required: false
    description: >
      Comma-separated regex patterns to exclude in addition to the analyzer
      defaults. Applied to ccsh `-e=` and tokei `--exclude` uniformly. A
      pattern that names an existing directory relative to the repo root
      (e.g. `vendor/engine`) is also hidden from DependaCharta.
  git_log_since:
    required: false
    description: >
      Optional date passed to `git log --since` (e.g. `2024-05-01`) for the
      git history metrics in `snapshot` mode. Use it when the parser cannot
      follow older history, e.g. a commit that replaced the whole tree. Files
      without commits since that date get no git metrics. Unset reads the
      full history.
  history_limit:
    required: false
    default: '20'
    description: >
      Maximum number of first-parent merge commits to walk in `history` mode.
      Ignored in `snapshot` mode.
  dependacharta_image:
    required: false
    default: ghcr.io/futuredapp/dependacharta-swift:fork-v0.2.1
    description: >
      Used only with dependency_engine=dependacharta. Fully-qualified image reference. The Futured fork covers
      all upstream languages plus Swift; pin via this input if you need a
      specific tag.
  dependency_engine:
    required: false
    default: codecharta
    description: >
      codecharta uses the integrated dependency parser, including experimental Swift.
      dependacharta keeps the legacy graph pipeline for rollback.
  analysis_image:
    required: false
    default: ghcr.io/futuredapp/codecharta-analysis:swift-7bb3f6dbb6a7d3cb6fb504831a8b3c9cc5e2ce74
    description: >
      Fully-qualified ccsh / tokei analysis image. The default fork build pins the
      Swift implementation by source commit. Consumers can override this input
      to select a later build or roll back with dependency_engine=dependacharta.

outputs:
  cc_path:
    description: >
      Path to the `${project_name}.cc.json.gz` map produced in `snapshot` mode.
      Empty in `history` mode.
    value: ${{ steps.run.outputs.cc_path }}
  cg_path:
    description: >
      Path to the `${project_name}.cg.json` DependaCharta graph produced in
      legacy `snapshot` mode. Empty for native dependencies and in `history` mode.
    value: ${{ steps.run.outputs.cg_path }}
  snapshots_dir:
    description: >
      Path to the directory containing the historical `.cc.json.gz` files
      produced in `history` mode. Empty in `snapshot` mode.
    value: ${{ steps.run.outputs.snapshots_dir }}

runs:
  using: composite
  steps:
    - name: Pull DependaCharta image
      # History mode doesn't run DependaCharta (it walks merge commits via
      # ccsh unifiedparser --commit only). Skip the pull to avoid 100+ MB of
      # wasted network traffic on backfill runs.
      if: inputs.mode == 'snapshot' && inputs.dependency_engine == 'dependacharta'
      shell: bash
      run: docker pull "${{ inputs.dependacharta_image }}"

    - name: Run codecharta analysis
      id: run
      shell: bash
      run: ${{ github.action_path }}/codecharta.sh ${{ inputs.mode }}
      env:
        CODECHARTA_PROJECT_NAME: ${{ inputs.project_name }}
        CODECHARTA_STACK: ${{ inputs.stack }}
        CODECHARTA_FILE_EXTENSIONS: ${{ inputs.file_extensions }}
        CODECHARTA_TOKEI_TYPES: ${{ inputs.tokei_types }}
        CODECHARTA_EXTRA_EXCLUDES: ${{ inputs.extra_excludes }}
        CODECHARTA_GIT_LOG_SINCE: ${{ inputs.git_log_since }}
        CODECHARTA_HISTORY_PULL_REQUEST_LIMIT: ${{ inputs.history_limit }}
        CODECHARTA_DEPENDENCY_ENGINE: ${{ inputs.dependency_engine }}
        CODECHARTA_ANALYSIS_IMAGE: ${{ inputs.analysis_image }}
        DEPENDACHARTA_IMAGE: ${{ inputs.dependacharta_image }}
        DEPENDACHARTA_RUNNER: docker
        REPO_ROOT: ${{ github.workspace }}
