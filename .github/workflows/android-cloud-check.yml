name: Android Pull Request Check

on:
  workflow_call:
    inputs:
      ## Required Inputs
      LINT_GRADLE_TASKS:
        description: "A Gradle task(s) for executing lint check, for example `lintCheck lintRelease`"
        required: true
        type: string
      TEST_GRADLE_TASKS:
        description: "A Gradle task(s) for executing unit tests, for example `testReleaseUnitTest` or `testDevEnterpriseUnitTest`"
        required: true
        type: string

      ## Optional Inputs
      USE_GIT_LFS:
        description: "Whether to download Git-LFS files"
        type: boolean
        required: false
        default: false
      TIMEOUT_MINUTES:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30
      JAVA_VERSION:
        description: "Java version to use"
        required: false
        type: string
        default: '17'
      JAVA_DISTRIBUTION:
        description: "Java distribution to use"
        required: false
        type: string
        default: 'zulu'
      GRADLE_OPTS:
        description: "Gradle options"
        required: false
        type: string
        default: ""
      RUNS_ON:
        description: "Runner label for the job, for example `ubuntu-latest` (default) or `self-hosted` to run the checks on the mac runners"
        required: false
        type: string
        default: ubuntu-latest
      ANDROID_SDK_PACKAGES:
        description: "When set, installs the Android SDK in the job (android-actions/setup-android) with these sdkmanager packages, for runners whose image has no SDK, for example `platforms;android-36 build-tools;36.0.0 platform-tools`"
        required: false
        type: string
        default: ""
      KOTLIN_NATIVE_CACHE:
        description: "Caches ~/.konan/dependencies (LLVM, libffi) between runs; for KMP projects checked on macOS, where the Kotlin/Native toolchain downloads them on every fresh runner"
        required: false
        type: boolean
        default: false

    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
        description: "Configuration cache encryption key"
      GITHUB_TOKEN_DANGER:
        required: false
        description: "GitHub token for Danger. Must have permissions to read and write issues and pull requests."

jobs:
  test:
    name: Lint & Tests
    runs-on: ${{ inputs.RUNS_ON }}
    timeout-minutes: ${{ inputs.TIMEOUT_MINUTES }}
    env:
      GRADLE_OPTS: ${{ inputs.GRADLE_OPTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.USE_GIT_LFS }}
      - name: Set up environment
        uses: futuredapp/.github/.github/actions/android-setup-environment@2.4.6
        with:
          java_version: ${{ inputs.JAVA_VERSION }}
          java_distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          gradle_cache_encryption_key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Set up Android SDK
        if: ${{ inputs.ANDROID_SDK_PACKAGES != '' }}
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ inputs.ANDROID_SDK_PACKAGES }}
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Cache Kotlin/Native dependencies
        if: ${{ inputs.KOTLIN_NATIVE_CACHE }}
        uses: actions/cache@v4
        with:
          path: ~/.konan/dependencies
          key: konan-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/libs.versions.toml') }}
      - name: Run checks
        uses: futuredapp/.github/.github/actions/android-check@2.4.6
        with:
          lint_gradle_task: ${{ inputs.LINT_GRADLE_TASKS }}
          test_gradle_task: ${{ inputs.TEST_GRADLE_TASKS }}
          github_token_danger: ${{ secrets.GITHUB_TOKEN_DANGER }}
