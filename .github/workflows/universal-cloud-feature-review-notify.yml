name: Universal Cloud Feature Review Notify

# Opt-in second job after a build: announces PRs labeled feature-complete that the build contains.
# Call it from a separate caller job, so the build job's token permissions stay unchanged.
on:
  workflow_call:
    inputs:
      from_commit:
        description: 'First commit of the build range (exclusive). Use the build workflow output of the same name.'
        type: string
        required: true
      to_commit:
        description: 'Last commit of the build range. Use the build workflow output of the same name.'
        type: string
        required: true
      reviewer:
        description: 'Who to mention in the message, e.g. "<@U0123456>". Empty mentions nobody.'
        type: string
        default: ''
      build_name:
        description: 'Build name shown in the message.'
        type: string
        default: 'Build'

    secrets:
      SLACK_WEBHOOK_FEATURE_REVIEW:
        required: false
        description: 'Slack incoming webhook. Without it the message is only printed to the log.'

jobs:
  notify:
    name: Notify feature review
    if: inputs.from_commit != '' && inputs.to_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Notify feature review
        # A failed Slack message must not turn a successful build red.
        continue-on-error: true
        uses: futuredapp/.github/.github/actions/universal-feature-review-notify@2.8.0
        with:
          github_token: ${{ github.token }}
          from_commit: ${{ inputs.from_commit }}
          to_commit: ${{ inputs.to_commit }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_FEATURE_REVIEW }}
          reviewer_mention: ${{ inputs.reviewer }}
          build_name: ${{ inputs.build_name }}
