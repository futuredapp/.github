name: Notify consumer repos

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:
    inputs:
      repos:
        description: 'Only process these repos (space-separated org/name). Leave empty to discover all consumer repos.'
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create PRs in consumer repos
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_REPOS_WHITELIST: ${{ vars.NOTIFY_REPOS_WHITELIST }}
          NOTIFY_REPOS: ${{ inputs.repos }}
          # Retry tuning — optional repository variables, script defaults apply when unset
          NOTIFY_RETRY_MAX_ATTEMPTS: ${{ vars.NOTIFY_RETRY_MAX_ATTEMPTS }}
          NOTIFY_RETRY_BASE_DELAY: ${{ vars.NOTIFY_RETRY_BASE_DELAY }}
          NOTIFY_RETRY_MAX_DELAY: ${{ vars.NOTIFY_RETRY_MAX_DELAY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          echo "Version: $VERSION"
          bash .github/scripts/notify-consumer-repos.sh "$VERSION"
