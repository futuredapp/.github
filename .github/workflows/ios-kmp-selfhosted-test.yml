name: iOS KMP Self-hosted Test

on:
  workflow_call:
    inputs:
      use_git_lfs:
        description: Whether to download Git-LFS files.
        type: boolean
        required: false
        default: false
      custom_values:
        description: "Custom string that can contains values specified in your workflow file. Those values will be placed into environment variable. Example: \"CUSTOM-1: 1; CUSTOM-2: 2\""
        type: string
        required: false
      timeout_minutes:
        description: "Job timeout in minutes"
        type: number
        required: false
        default: 30
      kmp_swift_package_integration:
        description: "Whether KMP is integrated in Xcode project as a Swift Package"
        type: boolean
        required: false
        default: false
      kmp_swift_package_path:
        description: "If `swift_package_integration` is 'true', then specifies a location of local Swift Package with Makefile. Example: 'iosApp/shared/KMP`"
        type: string
        required: false
        default: iosApp/shared/KMP
      kmp_swift_package_flavor:
        description: "Build flavor of KMP Package"
        type: string
        default: dev
        required: false
      java_version:
        description: "Java version to use"
        required: false
        type: string
        default: '17'
      java_distribution:
        description: "Java distribution to use"
        required: false
        type: string
        default: 'zulu'
      custom_build_path:
        description: "Path to directory containing Fastfile. If not specified, uses iosApp. Example: iosApp/appA"
        type: string
        required: false
      kotlin_native_cache:
        description: "Whether to cache the Kotlin/Native compiler caches of library dependencies (~/.konan/.../klib/cache) between runs. A debug framework link on a fresh runner otherwise rebuilds them every time, which can take several minutes for large dependency graphs like Compose Multiplatform."
        type: boolean
        required: false
        default: true

    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
        description: "Configuration cache encryption key"
      GITHUB_TOKEN_DANGER:
        required: false
        description: "GitHub token for Danger. Must have permissions to read and write issues and pull requests."

jobs:
  test:
    name: Test
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.use_git_lfs }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      # Only the caches of library dependencies (`*-user*`) are built during the link; the compiler,
      # platform klibs and their caches come with the Kotlin/Native distribution. Library caches live in
      # per-version folders, so the key changes with libs.versions.toml and has no restore-keys fallback:
      # a partial restore would carry outdated library versions into every new cache.
      - name: Cache Kotlin/Native library caches
        if: ${{ inputs.kotlin_native_cache }}
        uses: actions/cache@v6
        with:
          path: ~/.konan/kotlin-native-prebuilt-*/klib/cache/*-user*
          key: konan-klib-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/libs.versions.toml') }}
      - name: Build KMP Package
        if: ${{ inputs.kmp_swift_package_integration }}
        env:
          KMP_BUILD_FLAVOR: ${{ inputs.kmp_swift_package_flavor }}
          KMP_FRAMEWORK_BUILD_TYPE: debug
          KMP_FRAMEWORK_TARGETS: simulator
        run: |
          cd ${{ inputs.kmp_swift_package_path }}
          make build
      - name: Fastlane Test
        uses: futuredapp/.github/.github/actions/ios-fastlane-test@2.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN_DANGER }}
          custom_values: ${{ inputs.custom_values }}
          ios_root_path: iosApp
          custom_build_path: ${{ inputs.custom_build_path }}
