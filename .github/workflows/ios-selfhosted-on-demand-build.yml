name: iOS Self-hosted On-Demand Build

on:
  workflow_call:
    inputs:
      # General
      runner_label:
        description: 'The custom label for the self-hosted runner to use for the build job.'
        type: string
        default: 'self-hosted'
      timeout_minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 30
      # Changelog
      changelog:
        description: 'Will be used as TestFlight changelog'
        type: string
        required: false
      checkout_depth:
        description: 'The depth of the git history to fetch for changelog generation.'
        type: number
        required: false
        default: 100
      changelog_fallback_lookback:
        description: 'The amount of time to look back for merge commits when no previous build commit is found. Default is 24 hours.'
        type: string
        required: false
        default: '24 hours'
      # Git LFS
      use_git_lfs:
        description: 'Whether to download Git-LFS files.'
        type: boolean
        default: false
      # Export secrets
      xcconfig_path:
        description: 'Path to the .xcconfig file. Selected secret properties will be appended to the end of this file.'
        type: string
        required: false
      required_keys:
        description: 'Comma-separated list of required keys.'
        type: string
        required: false
      # Custom values
      build_number:
        description: 'Custom build number. Skips auto-increment from TestFlight.'
        type: string
        required: false
      version_number:
        description: 'Custom version number. Overrides default (1.0.0).'
        type: string
        required: false
      custom_values:
        description: 'Custom string that can contains values specified in your workflow file. Those values will be placed into environment variable. Example: "CUSTOM-1: 1; CUSTOM-2: 2"'
        type: string
        required: false

    outputs:
      from_commit:
        description: 'First commit of the build range (exclusive), empty when a custom changelog is passed or nothing new was built. The feature review message uses it.'
        value: ${{ jobs.build.outputs.from_commit }}
      to_commit:
        description: 'Last commit of the build range, empty when a custom changelog is passed or nothing new was built.'
        value: ${{ jobs.build.outputs.to_commit }}

    secrets:
      MATCH_PASSWORD:
        required: true
        description: 'Password for decrypting of certificates and provisioning profiles.'
      APP_STORE_CONNECT_API_KEY_KEY:
        required: true
        description: 'Private App Store Connect API key for submitting build to App Store.'
      APP_STORE_CONNECT_API_KEY_KEY_ID:
        required: true
        description: 'Private App Store Connect API key for submitting build to App Store.'
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        required: false
        description: 'Private App Store Connect API issuer key for submitting build to App Store. Optional, because individual (user-based) API keys have no issuer ID.'
      SECRET_PROPERTIES:
        required: false
        description: 'Secrets in the format KEY = VALUE (one per line).'
      SLACK_WEBHOOK_FEATURE_REVIEW:
        required: false
        description: 'Slack incoming webhook for the feature review message. Without it no message is sent.'

jobs:
  build:
    runs-on: ${{ fromJson(format('["self-hosted", "{0}"]', inputs.runner_label)) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      from_commit: ${{ steps.detect_changes.outputs.from_commit }}
      to_commit: ${{ steps.detect_changes.outputs.to_commit }}

    steps:
      - name: Generate changelog if not provided
        if: ${{ inputs.changelog == '' }}
        id: detect_changes
        uses: futuredapp/.github/.github/actions/universal-detect-changes-and-generate-changelog@2.8.0
        with:
          checkout_depth: ${{ inputs.checkout_depth }}
          fallback_lookback: ${{ inputs.changelog_fallback_lookback }}
          use_git_lfs: ${{ inputs.use_git_lfs }}
      
      - name: Checkout
        if: ${{ inputs.changelog != '' }}
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.use_git_lfs }}

      - name: Set changelog
        id: set_changelog
        env:
          CUSTOM_CHANGELOG: ${{ inputs.changelog }}
          DETECTED_CHANGELOG: ${{ steps.detect_changes.outputs.changelog }}
        run: |
          # The changelog is built from PR titles or typed by hand: it goes through env, never into the script text.
          changelog="${CUSTOM_CHANGELOG:-$DETECTED_CHANGELOG}"
          delimiter="changelog_$(uuidgen)"
          printf 'changelog<<%s\n%s\n%s\n' "$delimiter" "$changelog" "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Export secrets
        if: ${{ inputs.xcconfig_path != '' }}
        uses: futuredapp/.github/.github/actions/ios-export-secrets@2.8.0
        with:
          XCCONFIG_PATH: ${{ inputs.xcconfig_path }}
          SECRET_PROPERTIES: ${{ secrets.SECRET_PROPERTIES }}
          REQUIRED_KEYS: ${{ inputs.required_keys }}

      - name: Fastlane Beta
        uses: futuredapp/.github/.github/actions/ios-fastlane-beta@2.8.0
        with:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          testflight_changelog: ${{ steps.set_changelog.outputs.changelog }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          build_number: ${{ inputs.build_number }}
          version_number: ${{ inputs.version_number }}
          custom_values: ${{ inputs.custom_values }}

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Build.ipa
          path: build_output/*.ipa

      - name: Upload dSYM
        uses: actions/upload-artifact@v7
        with:
          name: Build.app.dSYM.zip
          path: build_output/*.app.dSYM.zip
      
      - name: Save latest build commit SHA to file
        if: success()
        shell: bash
        run: |
          echo "${{ github.sha }}" > latest_builded_commit.txt
      
      - name: Store latest build commit SHA in cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: latest_builded_commit.txt
          key: ${{ steps.detect_changes.outputs.cache_key }}

  notify_feature_review:
    name: Notify feature review
    runs-on: ubuntu-latest
    needs: build
    # Opt-in: announces the PRs labeled feature-complete in this build when the caller passes the Slack webhook.
    if: success() && needs.build.outputs.from_commit != '' && needs.build.outputs.to_commit != ''
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Slack webhook
        id: check
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_FEATURE_REVIEW }}
          SLACK_USER_IDS: ${{ vars.SLACK_USER_IDS }}
          REVIEWER: ${{ vars.PROJECT_REVIEWER }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Feature review message skipped - no SLACK_WEBHOOK_FEATURE_REVIEW secret."
            exit 0
          fi
          # SLACK_USER_IDS maps GitHub logins to Slack member IDs, e.g. {"some-login": "U0123456"}.
          id=$(jq -r --arg login "$REVIEWER" '.[$login]? // empty' <<< "${SLACK_USER_IDS:-null}" 2> /dev/null || true)
          mention=""
          if [[ "$id" =~ ^[A-Z0-9]+$ ]]; then
            mention="<@$id>"
          elif [ -n "$REVIEWER" ]; then
            echo "::warning::No Slack ID for $REVIEWER in SLACK_USER_IDS; the message mentions nobody."
          fi
          {
            echo "enabled=true"
            echo "mention=$mention"
          } >> "$GITHUB_OUTPUT"
      - name: Notify feature review
        if: steps.check.outputs.enabled == 'true'
        # A failed Slack message must not turn a successful build red.
        continue-on-error: true
        uses: futuredapp/.github/.github/actions/universal-feature-review-notify@2.8.0
        with:
          github_token: ${{ github.token }}
          from_commit: ${{ needs.build.outputs.from_commit }}
          to_commit: ${{ needs.build.outputs.to_commit }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_FEATURE_REVIEW }}
          reviewer_mention: ${{ steps.check.outputs.mention }}
          build_name: 'On-demand build'
